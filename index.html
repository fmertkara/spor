<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spor</title>
<meta name="theme-color" content="#09090a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spor">
<style>html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a gym notebook page, a fixed tab bar at the bottom; numbers set big in a condensed display face. */
:root{
  --bg:#09090a; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.07); --line:rgba(255,255,255,.11); --solid:#151517;
  --glass-blur:blur(22px) saturate(150%);
  --fg:#f3f1ee; --muted:#8e8e93; --accent:#c8161d; --accent-ink:#ea4a50; --on-accent:#ffffff;
  --good:#c9c7c3; --danger:#e0484d;
  --p25:#c8161d; --p20:#e9e7e3; --p15:#a9abaf; --p10:#4a4c51; --p5:#f3f1ee; --p2:#6e7075;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2rem;text-transform:uppercase}
h2{font-size:1.45rem;text-transform:uppercase}
h3{font-size:1.15rem}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 32% at 18% 12%, rgba(200,22,29,.55), transparent 70%),
    radial-gradient(38% 30% at 88% 46%, rgba(120,12,18,.45), transparent 72%),
    radial-gradient(50% 36% at 30% 92%, rgba(90,92,98,.35), transparent 70%),
    var(--bg);
  filter:blur(30px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)} .dot.warn{background:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
option,optgroup{background:var(--solid);color:var(--fg)}
select,input[type=date],input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stepper .ctl{display:flex;align-items:center;gap:4px;width:100%}
.stepper button{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:700;line-height:1}
.stepper button:active{background:var(--line)}
.stepper input{flex:1;min-width:0;width:100%;text-align:center;background:none;border:0;font-family:var(--display);font-weight:800;font-size:2.3rem;padding:0;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}

.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;background:var(--fg);color:var(--bg);font-size:1rem;letter-spacing:.02em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:9px 12px;font-size:.88rem}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--accent-ink);font-weight:700;padding:4px 0}

.hint{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hint b{color:var(--fg);font-weight:700}
.plates{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.plate{display:inline-flex;align-items:center;justify-content:center;border-radius:3px;font-size:.62rem;font-weight:800;color:#fff;min-width:22px;padding:0 3px}
.plate.p25{background:var(--p25);height:30px}.plate.p20{background:var(--p20);height:30px;color:#16181b}.plate.p15{background:var(--p15);height:26px;color:#16181b}
.plate.p10{background:var(--p10);height:22px}.plate.p5{background:var(--p5);height:18px;color:#16181b}.plate.p2{background:var(--p2);height:15px}
.bar{width:26px;height:6px;background:var(--muted);border-radius:2px}

.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exblock{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.exblock:first-of-type{border-top:0;padding-top:0}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.set{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-variant-numeric:tabular-nums;font-weight:600;font-size:.92rem}
.set.pr{border-color:var(--fg)}
.set .x{width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1rem;line-height:1;padding:0}
.set .x:hover{color:var(--danger)}
.badge{font-size:.66rem;font-weight:800;letter-spacing:.08em;color:var(--fg);text-transform:uppercase}

.empty{text-align:center;padding:22px 8px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty .num{font-size:2.6rem;color:rgba(255,255,255,.14)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .name{font-weight:700;min-width:0}
.item .meta{font-size:.82rem;color:var(--muted);grid-column:1}
.item .big{grid-row:1/3;grid-column:2;font-size:1.6rem;text-align:right;line-height:1}
.item .big small{font-size:.8rem;color:var(--muted);font-family:var(--body);font-weight:600}
.group-title{padding:14px 4px 2px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:1.9rem;line-height:1}
.stat .num small{font-size:.85rem;font-family:var(--body);color:var(--muted);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--solid);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.hist{display:flex;flex-direction:column;gap:10px}
.hist .h{display:flex;flex-direction:column;gap:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,14,16,.55);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{background:none;border:0;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.76rem;font-weight:700}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent-ink)}

.backup-nag{border-color:var(--accent);gap:10px}
.start{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:12vh}
.start h1{font-size:clamp(2.2rem,11.5vw,3.4rem);line-height:.95}
.start p{margin:0;font-size:1rem}
.daybtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.daybtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 18px;border-radius:16px;border:1px solid var(--line);
  background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);text-align:left}
.daybtn .nm{font-family:var(--display);font-weight:800;font-size:1.8rem;text-transform:uppercase;letter-spacing:.02em}
.daybtn .sub{font-size:.8rem;color:var(--muted);text-align:right}
.daybtn:active{background:var(--surface-2)}
.work-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:6px}
.work-head h1{font-size:2.4rem}
.expills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.expills::-webkit-scrollbar{display:none}
.expill{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);max-width:170px;text-align:left}
.expill .n{font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.06em}
.expill .t{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:146px}
.expill .c{font-size:.72rem;color:var(--muted)}
.expill.done .c{color:var(--fg)}
.expill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.expill[aria-pressed="true"] .n,.expill[aria-pressed="true"] .c{color:rgba(0,0,0,.55)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:rgba(243,241,238,.9);color:#0c0c0d;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-radius:12px;padding:11px 14px;font-weight:700;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.pr{background:var(--accent);color:var(--on-accent)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800;padding:0}
.add-ex{display:flex;flex-direction:column;gap:10px}
.dangerbtn{color:var(--danger)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

</head>
<body>
<div class="wrap">
  <div class="panel backup-nag" id="backupNag" hidden>
    <div id="backupNagText" style="font-weight:600"></div>
    <div class="row">
      <button class="btn small" id="nagBackup">Yedeği indir</button>
      <button class="btn ghost small" id="nagLater">Sonra</button>
    </div>
  </div>

  <!-- BUGÜN -->
  <section id="v-today" class="wrap" style="gap:18px">
    <div class="start" id="startView">
      <h1>Antrenmana<br>başla</h1>
      <p class="muted">Bugün hangi gün?</p>
      <div class="daybtns" id="dayBtns"></div>
      <button class="link" id="freeBtn">Programsız devam et</button>
    </div>

    <div class="wrap" id="workView" hidden style="gap:18px">
    <div class="work-head">
      <h1 id="progTitle">Push</h1>
      <button class="link" id="changeDay">Günü değiştir</button>
    </div>
    <div class="panel">
      <div class="expills" id="exPills"></div>
      <div class="field" id="exSelWrap">
        <label class="label" for="exSel">Hareket</label>
        <select id="exSel"></select>
      </div>
      <div class="steppers">
        <div class="stepper">
          <span class="label">Kilo (kg)</span>
          <div class="ctl"><button id="kgMinus" aria-label="2,5 kg azalt">−</button><input id="kgIn" inputmode="decimal" aria-label="Kilo"><button id="kgPlus" aria-label="2,5 kg artır">+</button></div>
        </div>
        <div class="stepper">
          <span class="label">Tekrar</span>
          <div class="ctl"><button id="repMinus" aria-label="1 tekrar azalt">−</button><input id="repIn" inputmode="numeric" aria-label="Tekrar"><button id="repPlus" aria-label="1 tekrar artır">+</button></div>
        </div>
      </div>
      <button class="btn wide" id="addSet">Set ekle</button>
      <div class="hint" id="hint"></div>
    </div>

    <div class="panel">
      <div class="day-head"><h2 id="dayTitle">Bugün</h2><span class="label" id="dayMeta"></span></div>
      <div class="row" style="justify-content:space-between">
        <button class="link" id="dateToggle">Başka bir güne kaydet</button>
        <button class="link" id="dateToday" hidden>Bugüne dön</button>
      </div>
      <input type="date" id="dateIn" aria-label="Kayıt tarihi" hidden>
      <div id="dayList"></div>
    </div>
    </div>
  </section>

  <!-- HAREKETLER -->
  <section id="v-ex" hidden>
    <div class="wrap" id="exListView" style="gap:18px">
      <div class="panel" style="gap:0;padding-block:6px">
        <div id="exList" class="list"></div>
      </div>
      <div class="panel add-ex">
        <h3>Yeni hareket ekle</h3>
        <div class="row">
          <input type="text" id="newExName" placeholder="Örn. Hip Thrust" style="flex:2 1 160px" aria-label="Hareket adı">
          <select id="newExGroup" style="flex:1 1 110px" aria-label="Kas grubu"></select>
        </div>
        <label class="row muted" style="gap:8px;font-size:.9rem"><input type="checkbox" id="newExBar"> Barla yapılıyor (plaka hesabı göster)</label>
        <button class="btn ghost" id="newExBtn">Ekle</button>
      </div>
    </div>
    <div class="wrap" id="exDetail" hidden style="gap:18px"></div>
  </section>

  <!-- GEÇMİŞ -->
  <section id="v-hist" hidden>
    <div class="wrap" style="gap:18px">
    <div class="wrap" id="histList" style="gap:18px"></div>
    <div class="panel">
      <h3>Yedek</h3>
      <p class="muted" style="margin:0;font-size:.9rem">Kayıtların sadece bu telefonda duruyor. Ara sıra yedek indir; telefon değiştirirsen ya da tarayıcı verilerini silersen yedekten geri yükleyebilirsin.</p>
      <div class="row">
        <button class="btn small" id="expBtn">Yedeği indir</button>
        <label class="btn ghost small" for="impIn" style="cursor:pointer">Yedekten geri yükle</label>
        <input type="file" id="impIn" accept="application/json,.json" hidden>
      </div>
    </div>
    </div>
  </section>
</div>

<nav class="tabs" aria-label="Bölümler"><div class="in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h20M5 8v8M19 8v8M8 6v12M16 6v12"/></svg>Antrenman</button>
  <button data-tab="ex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 16l4-5 4 3 5-7"/></svg>Hareketler</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Geçmiş</button>
</div></nav>

<div id="toast" class="toast" hidden></div>

<script>
(() => {
const GROUPS = ["Göğüs","Sırt","Bacak","Omuz","Kol","Karın","Diğer"];
const DEFAULT_EX = [
  ["bench","Bench Press","Göğüs",1],["incline","Incline Dumbbell Press","Göğüs",0],["fly","Cable Fly","Göğüs",0],
  ["deadlift","Deadlift","Sırt",1],["row","Barbell Row","Sırt",1],["lat","Lat Pulldown","Sırt",0],["cablerow","Cable Row","Sırt",0],
  ["squat","Squat","Bacak",1],["legpress","Leg Press","Bacak",0],["rdl","Romanian Deadlift","Bacak",1],["legcurl","Leg Curl","Bacak",0],["legext","Leg Extension","Bacak",0],
  ["ohp","Overhead Press","Omuz",1],["lateral","Lateral Raise","Omuz",0],
  ["curl","Biceps Curl","Kol",0],["hammer","Hammer Curl","Kol",0],["pushdown","Triceps Pushdown","Kol",0]
].map(([id,name,group,bar])=>({id,name,group,bar:!!bar}));
const LS_KEY = "demir-defteri-v1";
const $ = id => document.getElementById(id);

// ---------- state ----------
let exercises = DEFAULT_EX.slice();
let days = {};               // "YYYY-MM-DD" -> {date, sets:[{id,ex,kg,reps,t}]}
let db = null, uid = null, remoteReady = false;

function lsRead(){ try{ const o = JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(o){ if(Array.isArray(o.exercises)&&o.exercises.length) exercises=o.exercises; if(o.days) days=o.days; } }catch(e){} }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({exercises,days})); }catch(e){} }

// one write at a time per doc
const queues = {};
function writeDoc(key, body){
  lsWrite();
  return;
  const ref = db.collection("data/users/"+uid).doc(key);
  queues[key] = (queues[key]||Promise.resolve()).then(()=> body ? ref.set(body) : ref.delete())
    .catch(e => { if(e && e.code==="unavailable") return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=> body?ref.set(body):ref.delete()).catch(()=>setSync("warn","Kaydedilemedi, bu cihazda tutuluyor"));
      setSync("warn", e && e.code==="quota_exceeded" ? "Depolama dolu" : "Kaydedilemedi, bu cihazda tutuluyor"); });
}
const saveDay = date => writeDoc("d-"+date, days[date] && days[date].sets.length ? days[date] : null);
const saveExercises = () => writeDoc("exercises", {list: exercises});

function setSync(){}

// ---------- helpers ----------
const fmt = n => (Math.round(n*100)/100).toLocaleString("tr-TR");
const pad = n => String(n).padStart(2,"0");
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const DAYS = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
function dateLabel(k, long){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d);
  if(k===todayKey()) return "Bugün"; const yd=new Date(); yd.setDate(yd.getDate()-1);
  if(k===yd.getFullYear()+"-"+pad(yd.getMonth()+1)+"-"+pad(yd.getDate())) return "Dün";
  return long ? d+" "+MONTHS[m-1]+" "+DAYS[dt.getDay()] : d+" "+MONTHS[m-1]; }
const parseNum = s => parseFloat(String(s).replace(",", "."));
const e1rm = (kg,reps) => reps<=1 ? kg : kg*(1+reps/30);
const exById = id => exercises.find(e=>e.id===id) || {id, name:id, group:"Diğer", bar:false};
const sortedDates = () => Object.keys(days).filter(k=>days[k].sets.length).sort();
function setsFor(exId){ const out=[]; for(const k of sortedDates()) for(const s of days[k].sets) if(s.ex===exId) out.push({...s,date:k}); return out; }
function prFor(exId, exceptId){ let best=null; for(const s of setsFor(exId)){ if(s.id===exceptId) continue; if(!best||s.kg>best.kg||(s.kg===best.kg&&s.reps>best.reps)) best=s; } return best; }
function isPRSet(s){ const prior = setsFor(s.ex).filter(o=>o.date<s.date||(o.date===s.date&&o.t<s.t)); return s.kg>0 && prior.length>0 && prior.every(o=>o.kg<s.kg); }
function el(tag, attrs={}, ...kids){ const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") n.className=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else if(k==="text") n.textContent=v; else n.setAttribute(k,v);} for(const c of kids) if(c!=null) n.append(c); return n; }

function plateHTML(kg){
  const side=(kg-20)/2; if(side<0) return null;
  let rest=side; const used=[];
  for(const p of [25,20,15,10,5,2.5,1.25]){ while(rest>=p-1e-9){ used.push(p); rest-=p; } }
  if(rest>1e-6) return null;
  const wrap=el("div",{class:"plates"}); wrap.append(el("span",{class:"bar"}));
  const cls={25:"p25",20:"p20",15:"p15",10:"p10",5:"p5",2.5:"p2",1.25:"p2"};
  for(const p of used) wrap.append(el("span",{class:"plate "+cls[p],text:fmt(p)}));
  if(!used.length) wrap.append(el("span",{class:"muted",text:"sadece bar",style:"font-size:.8rem;margin-left:4px"}));
  return wrap;
}

function lastDoneDate(pk){ const ids=new Set(programs[pk].ex); let last=null; for(const k of sortedDates()) if(days[k].sets.some(s=>ids.has(s.ex))) last=k; return last; }

function prefill(){

  $("kgIn").value = last ? fmt(last.kg) : (exById(selEx).bar ? "20" : "10");
  $("repIn").value = last ? last.reps : 8;

function renderHint(){
  const h=$("hint"); h.innerHTML="";
  const ex=exById(selEx), hist=setsFor(selEx).filter(s=>s.date<$("dateIn").value);
  if(hist.length){ const lastDate=hist[hist.length-1].date; const ls=hist.filter(s=>s.date===lastDate);

function renderDay(){
  const k=$("dateIn").value||todayKey(); const day=days[k]; const box=$("dayList"); box.innerHTML="";
  $("dayTitle").textContent=dateLabel(k,true);
  const sets=day?day.sets:[];
  const vol=sets.reduce((a,s)=>a+s.kg*s.reps,0);
  $("dayMeta").textContent = sets.length ? sets.length+" set · "+fmt(Math.round(vol))+" kg hacim" : "";
  if(!sets.length){ box.append(el("div",{class:"empty"}, el("span",{class:"num",text:"0 SET"}), el("span",{text:"Yukarıdan hareketi, kiloyu ve tekrarı seçip “Set ekle”ye bas."}))); return; }
  const order=[]; for(const s of sets) if(!order.includes(s.ex)) order.push(s.ex);
  for(const exId of order){
    const blk=el("div",{class:"exblock"}); blk.append(el("h3",{text:exById(exId).name}));
    const row=el("div",{class:"sets"});
    for(const s of sets.filter(x=>x.ex===exId)){
      const pr=isPRSet({...s,date:k});
      const chip=el("span",{class:"set"+(pr?" pr":"")}, fmt(s.kg)+" kg × "+s.reps, pr?el("span",{class:"badge",text:"Rekor"}):null,
        el("button",{class:"x","aria-label":"Seti sil",text:"×",onclick:()=>removeSet(k,s.id)}));
      row.append(chip);
    }
    blk.append(row); box.append(blk);
  }
}
function addSet(){
  const kg=parseNum($("kgIn").value), reps=parseInt($("repIn").value,10);
  if(!(kg>=0) || !(reps>0)){ toast("Kilo ve tekrar sayısını kontrol et."); return; }
  const k=$("dateIn").value||todayKey();
  if(!days[k]) days[k]={date:k,sets:[]};
  const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), ex:selEx, kg, reps, t:Date.now()};
  const prevPR=prFor(selEx);
  days[k].sets.push(s); saveDay(k);
  renderDay(); renderHint(); renderPills();
  if(prevPR && kg>prevPR.kg) toast("Yeni rekor: "+exById(selEx).name+" "+fmt(kg)+" kg", "pr");
}
let lastRemoved=null;
function removeSet(k,id){
  const day=days[k]; const i=day.sets.findIndex(s=>s.id===id); if(i<0) return;
  lastRemoved={k,set:day.sets[i],i}; day.sets.splice(i,1); saveDay(k); renderAll();
  toast("Set silindi", "", "Geri al", ()=>{ if(!lastRemoved) return; const {k,set,i}=lastRemoved; if(!days[k]) days[k]={date:k,sets:[]}; days[k].sets.splice(i,0,set); saveDay(k); lastRemoved=null; renderAll(); });
}

function chartSVG(points){
  // points: [{date, kg}] best set per day
  const W=340,H=170,L=34,R=12,T=12,B=26;
  const ks=points.map(p=>p.kg); let lo=Math.min(...ks), hi=Math.max(...ks);
  const step = (hi-lo)>40?20:(hi-lo)>15?10:(hi-lo)>6?5:2.5;
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(hi===lo){hi+=step; lo=Math.max(0,lo-step);}
  const x=i=> points.length===1 ? (L+W-R)/2 : L+i*(W-L-R)/(points.length-1);
  const y=v=> T+(hi-v)*(H-T-B)/(hi-lo);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Günlük en ağır set grafiği">`;
  for(let v=lo; v<=hi+1e-9; v+=step){ s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`; }
  const pts=points.map((p,i)=>[x(i),y(p.kg)]);
  if(pts.length>1){ s+=`<path class="area" d="M${pts[0][0]},${y(lo)} L${pts.map(p=>p.join(",")).join(" L")} L${pts[pts.length-1][0]},${y(lo)} Z"/>`;
    s+=`<polyline class="ln" points="${pts.map(p=>p.join(",")).join(" ")}"/>`; }
  pts.forEach((p,i)=>{ s+=`<circle class="${i===pts.length-1?"end":"pt"}" cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3.2}"/>`; });
  const idx = points.length<=4 ? points.map((_,i)=>i) : [0, Math.round((points.length-1)/2), points.length-1];
  for(const i of idx) s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${points.length===1?"middle":i===0?"start":i===points.length-1?"end":"middle"}">${dateLabel(points[i].date)}</text>`;
  return s+"</svg>";
}
function openDetail(id){ detailEx=id; $("exListView").hidden=true; $("exDetail").hidden=false; renderDetail(); window.scrollTo(0,0); }
function closeDetail(){ detailEx=null; $("exListView").hidden=false; $("exDetail").hidden=true; renderExList(); }
function renderDetail(){
  const box=$("exDetail"); box.innerHTML=""; const e=exById(detailEx); const hist=setsFor(e.id);
  box.append(el("button",{class:"link",style:"align-self:flex-start",onclick:closeDetail,text:"← Hareketler"}));
  const head=el("div",{class:"panel"}); head.append(el("div",{class:"label",text:e.group}), el("h2",{text:e.name}));
  if(hist.length){
    const pr=prFor(e.id); const best1=Math.max(...hist.map(s=>e1rm(s.kg,s.reps)));
    const stats=el("div",{class:"stats"});
    const st=(lbl,val,unit)=>el("div",{class:"stat"}, el("span",{class:"label",text:lbl}), el("span",{class:"num"}, val, unit?el("small",{text:" "+unit}):null));
    stats.append(st("Rekor",fmt(pr.kg),"kg"), st("Tahmini 1RM",fmt(Math.round(best1*2)/2),"kg"), st("Toplam",String(hist.length),"set"));
    head.append(stats);
    const byDay={}; for(const s of hist) byDay[s.date]=Math.max(byDay[s.date]||0,s.kg);
    const pts=Object.keys(byDay).sort().map(d=>({date:d,kg:byDay[d]}));
    const ch=el("div",{style:"display:flex;flex-direction:column;gap:6px"}); ch.append(el("span",{class:"label",text:"Günlük en ağır set (kg)"}));
    const holder=el("div"); holder.innerHTML=chartSVG(pts); ch.append(holder); head.append(ch);
  } else head.append(el("p",{class:"muted",style:"margin:0",text:"Bu hareket için henüz set yok. Antrenman sekmesinden ekleyebilirsin."}));
  box.append(head);
  if(hist.length){
    const hp=el("div",{class:"panel"}); hp.append(el("h3",{text:"Geçmiş"}));
    const hl=el("div",{class:"hist"});
    const dates=[...new Set(hist.map(s=>s.date))].reverse();
    for(const d of dates){ const row=el("div",{class:"h"}); row.append(el("span",{class:"label",text:dateLabel(d,true)}));
      const ss=el("div",{class:"sets"}); for(const s of hist.filter(x=>x.date===d)) ss.append(el("span",{class:"set",style:"padding-right:12px"},fmt(s.kg)+" kg × "+s.reps)); row.append(ss); hl.append(row); }
    hp.append(hl); box.append(hp);

  const custom=!DEFAULT_EX.some(d=>d.id===e.id);
  if(custom) box.append(el("button",{class:"btn ghost small dangerbtn",style:"align-self:flex-start",text:"Bu hareketi listeden kaldır",onclick:()=>{
    exercises=exercises.filter(x=>x.id!==e.id); saveExercises(); fillExSelect(); closeDetail(); toast("Hareket kaldırıldı. Eski setleri silinmedi."); }}));
}
function addExercise(){
  const name=$("newExName").value.trim(); if(!name){ toast("Hareketin adını yaz."); return; }
  if(exercises.some(e=>e.name.toLocaleLowerCase("tr")===name.toLocaleLowerCase("tr"))){ toast("Bu hareket zaten listede."); return; }

let toastTimer=null;
function toast(msg, kind="", actionLabel, action){

  if(actionLabel) t.append(el("button",{text:actionLabel,onclick:()=>{ action(); t.hidden=true; }}));
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, actionLabel?5000:2600);
}

function bkRead(){ try{ return JSON.parse(localStorage.getItem(BK_KEY)||"{}"); }catch(e){ return {}; } }
function bkWrite(o){ try{ localStorage.setItem(BK_KEY, JSON.stringify(o)); }catch(e){} }
function downloadBackup(){ const blob=new Blob([JSON.stringify({app:"demir-defteri",v:1,exercises,days},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="spor-yedek-"+todayKey()+".json"; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  bkWrite({...bkRead(), last:Date.now(), snooze:0}); $("backupNag").hidden=true; toast("Yedek İndirilenler klasörüne kaydedildi"); }
function checkBackupNag(){
  const ts=[]; for(const k in days) for(const s of days[k].sets) ts.push(s.t);
  if(!ts.length){ $("backupNag").hidden=true; return; }
  const b=bkRead(), now=Date.now(); const ref=b.last||Math.min(...ts);
  if(now-ref<30*DAY_MS || (b.snooze&&now<b.snooze)){ $("backupNag").hidden=true; return; }
  $("backupNagText").textContent = b.last ? "Son yedeğin "+Math.floor((now-b.last)/DAY_MS)+" gün önceydi. Kayıtların kaybolmasın diye şimdi bir yedek al." : "Henüz hiç yedek almadın. Kayıtların kaybolmasın diye şimdi bir yedek al.";
  $("backupNag").hidden=false;
}

    let added=0;
    for(const ex of (o.exercises||[])) if(!exercises.some(x=>x.id===ex.id)) exercises.push(ex);
    for(const [k,d] of Object.entries(o.days||{})){ if(!days[k]) days[k]={date:k,sets:[]}; for(const st of d.sets||[]) if(!days[k].sets.some(x=>x.id===st.id)){ days[k].sets.push(st); added++; } days[k].sets.sort((a,b)=>a.t-b.t); }
    lsWrite(); renderAll(); renderHist(); toast(added+" set geri yüklendi");
