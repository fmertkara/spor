<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yazı tipi seç</title>

<style>
body{margin:0;background:#09090a;color:#f3f1ee;font-family:Manrope,system-ui,sans-serif;padding:20px 16px 40px}
.c{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.05);border-radius:18px;padding:18px;margin:0 0 16px;display:flex;flex-direction:column;gap:10px}
.no{font:700 .75rem Manrope,sans-serif;color:#8e8e93;letter-spacing:.1em}

.b{display:flex;gap:8px}.b span{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;text-transform:uppercase;font-size:1.05rem}
.n{font-size:2.4rem;line-height:1}
.f1{font-family:Cinzel,serif;font-weight:800}.f2{font-family:Oswald,sans-serif;font-weight:700}.f3{font-family:"Bebas Neue",sans-serif;font-weight:400;letter-spacing:.06em}.f4{font-family:Montserrat,sans-serif;font-weight:800}

<div class="c"><span class="no">1</span><div class="h f1">Antrenmana başla</div><div class="b f1"><span>Push</span><span>Pull</span><span>Legs</span></div><div class="n f1">85 kg × 6</div></div>
<div class="c"><span class="no">2</span><div class="h f2">Antrenmana başla</div><div class="b f2"><span>Push</span><span>Pull</span><span>Legs</span></div><div class="n f2">85 kg × 6</div></div>

</body></html>
